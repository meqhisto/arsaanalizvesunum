# Sunucu (production) kurulumu: docker compose -f docker-compose.server.yml up -d --build
services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    # İstek kaydı stdout'a yazılır (docker logs): zaman, yöntem, yol, durum, boyut, süre. IP ve sorgu dizgisi yazılmaz.
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "3", "--timeout", "120", "--preload",
              "--access-logfile", "-", "--access-logformat", "%(t)s %(m)s %(U)s %(s)s %(B)sB %(M)sms",
              "app:create_app()"]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      - "5000:5000"
    volumes:
      - uploads:/app/static/uploads
      - presentations:/app/static/presentations
      - is_belgeleri:/app/private_uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  uploads:
  presentations:
  is_belgeleri:
